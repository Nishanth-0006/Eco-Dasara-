<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Eco-Dasara Reward</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2e1d 0%, #1a4d2e 50%, #2d5a3d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(81, 199, 132, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: linear-gradient(135deg, #ffffff 0%, #f0fff4 100%);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35),
                       0 0 0 1px rgba(34, 197, 94, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.8s ease infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            background: linear-gradient(135deg, #0f5e20 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #66bb6a;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ticket {
            padding: 40px;
            border: 4px dashed #22c55e;
            border-radius: 20px;
            background: linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%);
            box-shadow: 0 15px 50px rgba(34, 197, 94, 0.2);
            margin-bottom: 40px;
            position: relative;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .ticket::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 30px;
            width: 20px;
            height: 20px;
            background: #0f2e1d;
            border-radius: 50%;
        }

        .ticket::after {
            content: '';
            position: absolute;
            top: -5px;
            right: 30px;
            width: 20px;
            height: 20px;
            background: #0f2e1d;
            border-radius: 50%;
        }

        .ticket-top {
            border-bottom: 2px dashed #81c784;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .ticket-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .ticket-label {
            color: #1b5e20;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .coupon-code {
            background: white;
            border: 3px solid #22c55e;
            border-radius: 15px;
            padding: 30px 20px;
            margin: 20px 0;
            font-size: 48px;
            font-weight: 900;
            color: #22c55e;
            letter-spacing: 4px;
            font-family: 'DM Mono', monospace;
            word-break: break-all;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2); }
            50% { box-shadow: 0 10px 50px rgba(34, 197, 94, 0.4); }
        }

        .validity {
            color: #2e7d32;
            font-size: 13px;
            font-weight: 600;
            margin-top: 15px;
        }

        .ticket-bottom {
            border-top: 2px dashed #81c784;
            padding-top: 20px;
            margin-top: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #f0fff4 0%, #e8f5e9 100%);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #c8e6c9;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: #22c55e;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.15);
            transform: translateY(-4px);
        }

        .stat-label {
            color: #66bb6a;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #0f5e20;
            font-size: 28px;
            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 16px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 50px rgba(34, 197, 94, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #22c55e;
            border: 2px solid #22c55e;
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.15);
        }

        .btn-secondary:hover {
            background: #f0fff4;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.25);
        }

        .confirmation-text {
            color: #2e7d32;
            font-size: 14px;
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8f6 100%);
            border-radius: 12px;
            border-left: 4px solid #22c55e;
            line-height: 1.6;
        }

        .message-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 36px;
            }

            .success-icon {
                font-size: 60px;
            }

            .coupon-code {
                font-size: 36px;
                letter-spacing: 2px;
                padding: 25px 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .ticket {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="success-icon">🎉</div>
            <h1>Congratulations!</h1>
            <p class="subtitle">Your Reward Code is Ready</p>

            <div class="ticket">
                <div class="ticket-top">
                    <div class="ticket-icon">🌿</div>
                    <div class="ticket-label">Eco-Dasara Reward Coupon</div>
                </div>

                <div class="coupon-code" id="couponCode">LOADING...</div>

                <div class="ticket-bottom">
                    <div class="validity" id="validity">Valid for one-time use</div>
                    <div class="stats" id="stats"></div>
                </div>
            </div>

            <div class="confirmation-text">
                <span class="message-icon">✨</span>
                <span id="message">Thank you for your commitment to environmental sustainability! Your recycling efforts are making a real difference for our planet. 🌍</span>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="goBack()">← Back to Home</button>
                <button class="btn btn-primary" onclick="copyCode()">📋 Copy Code</button>
            </div>
        </div>
    </div>

    <script>
        function loadRewardData() {
            const data = localStorage.getItem('rewardData');
            if (!data) {
                window.location.href = 'index.html';
                return;
            }

            const reward = JSON.parse(data);
            
            document.getElementById('couponCode').textContent = reward.coupon;
            
            const statsHTML = `
                <div class="stat-item">
                    <div class="stat-label">♻️ Plastic</div>
                    <div class="stat-value">${reward.plastic}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🔩 Steel</div>
                    <div class="stat-value">${reward.steel}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">📦 Total</div>
                    <div class="stat-value">${reward.total}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🌱 Carbon Saved</div>
                    <div class="stat-value">${reward.carbon} kg</div>
                </div>
            `;
            
            document.getElementById('stats').innerHTML = statsHTML;
            
            if (reward.images > 0) {
                const messageText = `Thank you for your commitment to environmental sustainability! You've recycled ${reward.total} bottles and saved approximately ${reward.carbon}kg of carbon. Your recycling efforts are making a real difference for our planet. 🌍`;
                document.getElementById('message').textContent = messageText;
            }
        }

        function copyCode() {
            const code = document.getElementById('couponCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copied to Clipboard!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        function goBack() {
            localStorage.removeItem('rewardData');
            window.location.href = 'index.html';
        }

        window.addEventListener('load', loadRewardData);
    </script>
</body>
</html>
